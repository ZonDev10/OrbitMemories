<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sign in to your Orbit Memories photo archive."
    />
    <title>Orbit Memories | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="auth-page login-page">
    <div class="page-transition-overlay" aria-hidden="true">
      <div class="transition-glow"></div>
    </div>

    <div class="page-shell">
      <div class="bg-orb orb-1" aria-hidden="true"></div>
      <div class="bg-orb orb-2" aria-hidden="true"></div>
      <div id="particles" aria-hidden="true"></div>

      <main class="auth-card login-card" aria-label="Login panel">
        <div class="card-glow" aria-hidden="true"></div>

        <div class="brand-wrap" aria-label="Orbit Memories">
          <div class="brand-lockup">
            <div class="brand-mark">O</div>
            <span class="brand-wordmark">Orbit <strong>Memories</strong></span>
          </div>
        </div>

        <p class="eyebrow">Secure Access</p>
        <h1>Welcome Back</h1>
        <p class="subtitle">Sign in to continue</p>

        <form id="loginForm" novalidate>
          <div class="field-wrap" id="userFieldWrap">
            <label for="username">Email or Username</label>
            <input
              id="username"
              name="username"
              type="text"
              placeholder="you@example.com"
              autocomplete="username"
              spellcheck="false"
            />
          </div>

          <div class="field-wrap" id="passwordFieldWrap">
            <label for="password">Password</label>
            <div class="password-input-wrap">
              <input
                id="password"
                name="password"
                type="password"
                placeholder="Enter your password"
                autocomplete="current-password"
              />
              <button
                type="button"
                class="password-toggle"
                aria-label="Show password"
                aria-pressed="false"
              >
                <span class="toggle-icon">Show</span>
              </button>
            </div>
          </div>

          <div class="form-row">
            <label class="checkbox-wrap" for="rememberMe">
              <input id="rememberMe" name="rememberMe" type="checkbox" />
              <span>Remember Me</span>
            </label>
            <a href="forgot-password.html" class="text-link">Forgot Password?</a>
          </div>

          <button type="submit" class="login-btn" id="loginButton">
            <span class="btn-text">Login</span>
            <span class="btn-loader" aria-hidden="true"></span>
          </button>

          <p id="formMessage" class="form-message" aria-live="polite"></p>

          <p class="register-text">
            New here?
            <a href="create-account.html" class="text-link accent-link">Create Account</a>
          </p>
        </form>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
