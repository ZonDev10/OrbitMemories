<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Reset your Orbit Memories account password."
    />
    <title>Orbit Memories | Reset Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="auth-page forgot-page">
    <div class="page-transition-overlay" aria-hidden="true">
      <div class="transition-glow"></div>
    </div>

    <div class="page-shell">
      <div class="bg-orb orb-1" aria-hidden="true"></div>
      <div class="bg-orb orb-2" aria-hidden="true"></div>
      <div id="particles" aria-hidden="true"></div>

      <main class="auth-card" aria-label="Forgot password panel">
        <div class="card-glow" aria-hidden="true"></div>

        <a href="index.html" class="back-button" aria-label="Back to login">← Back</a>

        <div class="brand-wrap" aria-label="Orbit Memories">
          <div class="brand-lockup">
            <div class="brand-mark">O</div>
            <span class="brand-wordmark">Orbit <strong>Memories</strong></span>
          </div>
        </div>

        <div class="card-header">
          <span class="step-pill">Secure Recovery</span>
          <h1>Reset Password</h1>
        </div>

        <p class="card-copy">
          Email delivery is not configured in this demo, so reset links cannot be sent yet.
        </p>

        <form id="forgotForm" novalidate>
          <div class="field-wrap" id="forgotFieldWrap">
            <label for="forgotEmail">Email address</label>
            <input
              id="forgotEmail"
              name="forgotEmail"
              type="email"
              placeholder="you@example.com"
              autocomplete="email"
            />
          </div>

          <button type="submit" class="auth-btn" id="forgotButton">
            <span class="btn-text">Send Reset Link</span>
            <span class="btn-loader" aria-hidden="true"></span>
          </button>

          <p id="forgotMessage" class="form-message" aria-live="polite"></p>

          <p class="tip-text">
            Remembered your password?
            <a href="index.html" class="inline-link">Back to Login</a>
          </p>
        </form>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
